<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bgm.res · 本地番剧</title><link rel="stylesheet" href="includes/library-desktop.css"><link rel="stylesheet" href="includes/library-polish.css"><link rel="stylesheet" href="includes/library-themes.css"><link rel="stylesheet" href="includes/library-chrome.css"></head>
<body>
  <div class="app-backdrop" aria-hidden="true"></div>
  <div class="window-bar"><span class="window-brand">bgm<span>res</span></span><span>本地番剧管理</span></div>
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 3h18v22H3zM8 3v22M3 8h5M3 20h5"/></svg></span><div>我的番剧库<small>本地收藏 · 随时续看</small></div></div>
    <nav aria-label="主导航"><button id="organize" data-nav="organizer" class="nav-item"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></svg></span>资源整理</button><button data-nav="library" class="nav-item active" aria-current="page"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>媒体库<b id="library-count"></b></button><button data-nav="discovery" class="nav-item"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5z"/></svg></span>发现</button><button data-nav="resources" class="nav-item"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg></span>资源搜索</button><button data-nav="subtitle-search" class="nav-item"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M6 11h4m4 0h4M6 15h7m3 0h2"/></svg></span>字幕搜索</button><button data-nav="downloads" class="nav-item"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg></span>下载任务</button><button data-nav="issues" class="nav-item"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 10 17H2L12 3Z"/><path d="M12 9v4m0 3v1"/></svg></span>异常文件<b id="issue-count"></b></button></nav>
    <div class="sidebar-bottom"><button data-nav="settings" class="nav-item"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3-1 3-3 1v3l-2 2 2 2v3l3 1 1 3h6l1-3 3-1v-3l2-2-2-2V7l-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg></span>偏好设置</button><div class="sidebar-note"><i></i> 本地文件 · 重命名产物已绑定</div></div>
  </aside>
  <main>
    <header class="page-header"><div class="header-title-group"><button id="library-back" class="button quiet small" title="返回媒体库">← 返回媒体库</button><div class="page-heading"><h1 id="page-title">媒体库</h1><p id="page-subtitle"></p></div></div><div class="header-actions"><button id="scan-subtitles" class="button quiet">检测全库字幕</button><button id="refresh" class="button quiet">↻ 刷新</button></div></header>
    <div id="toolbar" class="toolbar"><label class="search"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></span><input id="search" placeholder="搜索番剧名称…" aria-label="搜索番剧名称"><kbd>Ctrl K</kbd></label><select id="media-type" aria-label="作品类型"><option value="">全部类型</option></select><select id="year" aria-label="年份"><option value="">全部年份</option></select><select id="subtitle-filter" aria-label="字幕状态"><option value="">全部字幕状态</option><option value="complete">全剧有字幕</option><option value="partial">部分集有字幕</option><option value="missing">已确认无字幕</option><option value="unconfirmed">未检测到 · 待确认</option><option value="unknown">未检测 / 未知</option></select><select id="sort" aria-label="排序"><option value="name">名称排序</option><option value="year">开播时间（新→旧）</option><option value="score">评分最高</option><option value="progress">观看进度</option></select><label id="poster-size-control" class="poster-size-control"><span>海报大小</span><input id="poster-size" type="range" min="120" max="280" step="10" value="180" aria-label="海报大小"><output id="poster-size-value" for="poster-size">180</output></label><div class="view-switch" aria-label="显示方式"><button id="grid-view" title="海报视图" aria-label="海报视图"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button><button id="list-view" title="列表视图" aria-label="列表视图"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h13M8 12h13M8 19h13M3 5h1M3 12h1M3 19h1"/></svg></button></div></div>
    <div id="filters" class="filter-bar"></div>
    <div id="notice" class="notice" role="status" hidden></div>
    <div id="content" class="content" tabindex="-1"><div class="empty-state">正在读取本地媒体库…</div></div>
  </main>
  <nav class="scroll-floats" aria-label="页面滚动"><button id="scroll-top" class="scroll-float" title="一键回顶部" aria-label="一键回顶部"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V4m-6 6 6-6 6 6"/></svg></button><button id="scroll-bottom" class="scroll-float" title="一键到底部" aria-label="一键到底部"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16m-6-6 6 6 6-6"/></svg></button></nav>
  <script src="js/library-desktop.cjs"></script>
</body></html>
